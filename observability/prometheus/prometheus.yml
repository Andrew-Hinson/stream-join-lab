global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308
  - job_name: flink
    static_configs:
      - targets:
          - jobmanager:9249
          - taskmanager:9249
  - job_name: kafka-jmx
    static_configs:
      - targets:
          - broker:7071
  - job_name: connect-jmx
    static_configs:
      - targets:
          - connect:7072
  - job_name: silo
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - silo:9000
