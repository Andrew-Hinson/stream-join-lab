table_name: map_results
main_dttm_col: null
description: Map duration and match counts
schema: demo
catalog: iceberg
sql: |
  SELECT
    map_name,
    ROUND(AVG(CAST(match_duration_seconds AS DOUBLE)), 2) AS avg_duration_seconds,
    COUNT(DISTINCT match_id) AS matches
  FROM iceberg.demo.match_facts
  GROUP BY 1
  ORDER BY matches DESC
