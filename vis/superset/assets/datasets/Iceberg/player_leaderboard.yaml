table_name: player_leaderboard
main_dttm_col: null
description: Player wins and K/D
schema: demo
catalog: iceberg
sql: |
  SELECT
    account_name,
    COUNT_IF(result = 'win') AS wins,
    ROUND(AVG(CAST(kills AS DOUBLE) / NULLIF(deaths, 0)), 2) AS kd
  FROM iceberg.demo.match_facts
  GROUP BY 1
  ORDER BY wins DESC
