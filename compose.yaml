x-flink-props: &flink-props
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    rest.address: jobmanager
    rest.port: 8081
    taskmanager.numberOfTaskSlots: 4
    execution.checkpointing.dir: file:///tmp/flink-checkpoint

services:
  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    image: apache/kafka:4.3.1
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  
  connect:
    image: debezium/connect:2.7.3.Final
    container_name: connect
    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: broker:29092
      GROUP_ID: stream-join-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connecT_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      - broker
      - db
  register-connector:
    image: curlimages/curl:8.5.0
    env_file: .env
    volumes:
      - ./scripts/register-connector.sh:/register.sh:ro
    environment:
      CONNECT_URL: http://connect:8083
    depends_on:
      connect:
        condition: service_started
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/register.sh"]
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      retries: 12

  silo-init:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mcli alias set local http://silo:9000 admin password && mcli mb local/warehouse --ignore-existing"
      
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://silo:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      silo-init:
        condition: service_completed_successfully


  jobmanager:
    build: ./flink-job
    ports:
      - "8081:8081"
    command: standalone-job --job-classname com.streamjoin.DataStreamJob
    environment:
      <<: *flink-props
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://silo:9000
    depends_on:
      register-connector:
        condition: service_completed_successfully
      broker:
        condition: service_started
      iceberg-rest:
        condition: service_healthy

  taskmanager:
    build: ./flink-job
    command: taskmanager
    environment:
      <<: *flink-props
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://silo:9000
    depends_on:
      - jobmanager

  seed:
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    build: .
    image: stream-join-python
    environment:
      DB_APP_WRITER_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: uv run --frozen --no-sync data_generator.py
    
    
  matches:
    depends_on:
      seed:
        condition: service_completed_successfully
      register-connector:
        condition: service_completed_successfully
    restart: "no"
    build: .
    image: stream-join-python
    environment:
      DB_APP_WRITER_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: >
      uv run --frozen --no-sync match_participants.py
      --count ${MATCH_COUNT:-400} --min-sleep 0.2 --max-sleep 1
  
  readback:
    image: stream-join-python
    build: .
    restart: "no"
    depends_on:
      matches:
        condition: service_completed_successfully
    environment:
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      AWS_S3_ENDPOINT: http://silo:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      MATCH_COUNT: ${MATCH_COUNT:-400}
    command: >
      sh -c "sleep 40 && uv run --frozen --no-sync read_match_facts.py"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  silo_data: