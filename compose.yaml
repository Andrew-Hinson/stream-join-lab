x-flink-props: &flink-props
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    rest.address: jobmanager
    rest.port: 8081
    taskmanager.numberOfTaskSlots: 4
    execution.checkpointing.dir: file:///tmp/flink-checkpoint
    metrics.reporters: prom
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249

services:
  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: stream_join_lab
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d stream_join_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    build: ./observability/kafka
    container_name: broker
    expose:
      - "7071"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka.yml"
    volumes:
      - ./observability/jmx/kafka.yml:/opt/jmx/kafka.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    build: ./observability/connect
    container_name: connect
    expose:
      - "7072"
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      GROUP_ID: stream-join-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connecT_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7072:/opt/jmx/connect.yml"
    volumes:
      - ./observability/jmx/connect.yml:/opt/jmx/connect.yml:ro
    depends_on:
      - broker
      - db
  register-connector:
    image: curlimages/curl:8.5.0
    volumes:
      - ./scripts/register-connector.sh:/register.sh:ro
    environment:
      CONNECT_URL: http://connect:8083
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: stream_join_lab
    depends_on:
      connect:
        condition: service_started
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/register.sh"]
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      retries: 12

  silo-init:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mcli alias set local http://silo:9000 admin password && mcli mb local/warehouse --ignore-existing"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://silo:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      silo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8181'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  jobmanager:
    build: ./flink-job
    ports:
      - "127.0.0.1:${FLINK_PORT:-8081}:8081"
    command: standalone-job --job-classname com.streamjoin.DataStreamJob
    environment:
      <<: *flink-props
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://silo:9000
    depends_on:
      register-connector:
        condition: service_completed_successfully
      broker:
        condition: service_started
      iceberg-rest:
        condition: service_healthy

  taskmanager:
    build: ./flink-job
    command: taskmanager
    environment:
      <<: *flink-props
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://silo:9000
    depends_on:
      - jobmanager

  seed:
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    build: .
    image: stream-join-python
    environment:
      DB_APP_WRITER_URL: postgresql://demo:demo@db:5432/stream_join_lab
    command: uv run --frozen --no-sync data_generator.py

  matches:
    depends_on:
      seed:
        condition: service_completed_successfully
      register-connector:
        condition: service_completed_successfully
    restart: "no"
    build: .
    image: stream-join-python
    environment:
      DB_APP_WRITER_URL: postgresql://demo:demo@db:5432/stream_join_lab
    command: >
      uv run --frozen --no-sync match_participants.py
      --count ${MATCH_COUNT:-400} --min-sleep 0.2 --max-sleep 1

  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana:11.6.16
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline-health.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  trino:
    image: trinodb/trino:476
    volumes:
      - ./vis/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      iceberg-rest:
        condition: service_healthy
      silo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  superset:
    build: ./vis/superset
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: stream-join-lab-not-secret
    volumes:
      - ./vis/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: ["/bin/bash", "/app/docker-init.sh"]
    depends_on:
      trino:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_URI: db:5432/stream_join_lab?sslmode=disable
      DATA_SOURCE_USER: demo
      DATA_SOURCE_PASS: demo
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/postgres-queries.yml
    volumes:
      - ./observability/prometheus/postgres-queries.yml:/etc/postgres_exporter/postgres-queries.yml:ro
    depends_on:
      db:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=broker:29092
    depends_on:
      broker:
        condition: service_healthy

volumes:
  db_data:
  silo_data:
